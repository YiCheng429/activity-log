name: CI/CD Deployment Pipeline

on:
  push:
    branches: [master, chore/a5-test-gates]
  workflow_dispatch:
    inputs:
      force_test_failure:
        description: "Intentionally fail the staging integration assertion (demo only)"
        type: boolean
        default: false
      publish_releases:
        description: "Publish dev/staging releases after tests pass (master or A5 branch)"
        type: boolean
        default: false
      request_production_review:
        description: "Queue the protected production simulation on the A5 branch"
        type: boolean
        default: false

permissions:
  contents: read

# Merges that land back to back would otherwise read the same last tag and
# try to create the same release; queue them instead of running in parallel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          LAST=$(git tag --list 'dev-v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            VERSION="1.0.0"
          else
            V="${LAST#dev-v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$V"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Last tag: ${LAST:-none} -> New version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          bun install --frozen-lockfile
          rm -rf dist
          bun x --no-install ncc build src/index.js --license licenses.txt
          zip -r build.zip dist
          sha256sum build.zip > build.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            build.zip
            build.zip.sha256
          if-no-files-found: error

  test-unit:
    name: Unit tests (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests and coverage gate
        run: npm run test:coverage | tee unit-coverage.log
        shell: bash
      - name: Save coverage and unit test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-node-${{ matrix.node }}
          path: unit-coverage.log
          if-no-files-found: error

  test-integration:
    name: Integration tests (${{ matrix.test-env }})
    needs: test-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-env: [staging, prod]
    env:
      TEST_ENV: ${{ matrix.test-env }}
      FORCE_TEST_FAILURE: ${{ inputs.force_test_failure && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Restore and verify release archive
        run: |
          sha256sum --check build.zip.sha256
          rm -rf dist
          unzip -q build.zip
      - name: Run bundled action with local GitHub API fixtures
        run: npm run test:integration | tee integration.log
        shell: bash
      - name: Save integration test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-log-${{ matrix.test-env }}
          path: integration.log
          if-no-files-found: warn


  deploy-dev:
    needs: [version, test-integration]
    if: (github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish_releases)) || (github.ref == 'refs/heads/chore/a5-test-gates' && inputs.publish_releases)
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-v${{ needs.version.outputs.version }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          sha256sum --check build.zip.sha256
          if [[ "$GITHUB_REF" == refs/heads/chore/a5-test-gates ]]; then
            TAG="a5-${TAG%%-v*}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          gh release create "$TAG" build.zip build.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" \
            --prerelease --notes "$NOTE (build tag: $BUILD_TAG)"

  deploy-staging:
    needs: [version, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: staging-v${{ needs.version.outputs.version }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          sha256sum --check build.zip.sha256
          if [[ "$GITHUB_REF" == refs/heads/chore/a5-test-gates ]]; then
            TAG="a5-${TAG%%-v*}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          gh release create "$TAG" build.zip build.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" \
            --prerelease --notes "$NOTE (build tag: $BUILD_TAG)"

  release-notes:
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from Git history
        run: |
          git log -n 15 --pretty='- %s (%h)' > release-notes.md
          {
            echo '## Commits for production review'
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  deploy-production:
    needs: [version, release-notes]
    runs-on: ubuntu-latest
    # Set this repository variable only after configuring Required reviewers.
    if: (github.ref == 'refs/heads/master' && vars.A5_PRODUCTION_ENABLED == 'true') || (github.ref == 'refs/heads/chore/a5-test-gates' && inputs.request_production_review)
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Verify approved A5 simulation (no release)
        if: github.ref == 'refs/heads/chore/a5-test-gates'
        run: sha256sum --check build.zip.sha256
      - name: Release Production Build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: prod-v${{ needs.version.outputs.version }}
        run: |
          sha256sum --check build.zip.sha256
          gh release create "$TAG" build.zip build.zip.sha256 --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md
